<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sorry in Smoke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Jost:wght@300;400&display=swap
<style>
  :root {
    --night: #0c0f1e;
    --night2: #161b33;
    --amber: #ffb347;
    --rose: #ff8fa3;
    --cream: #f6ecda;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--night);
    font-family: 'Jost', sans-serif;
    color: var(--cream);
    overflow: hidden;
  }
  #stage {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(120% 90% at 50% 70%, #1c2340 0%, #0c0f1e 60%, #060812 100%);
  }
  svg { width: 100%; height: 100%; display: block; }
  /* ---- full-screen flash / blink synced with crackers ---- */
  .flash {
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at 50% 55%, rgba(255,210,140,0.55), rgba(255,140,150,0.25) 45%, transparent 75%);
    opacity: 0;
    pointer-events: none;
    z-index: 8;
    animation: blink 2.6s ease-in-out infinite;
  }
  @keyframes blink {
    0%, 100% { opacity: 0; }
    3% { opacity: 0.85; }
    7% { opacity: 0.1; }
    10% { opacity: 0.6; }
    14% { opacity: 0; }
    46% { opacity: 0; }
    50% { opacity: 0.7; }
    54% { opacity: 0.05; }
    58% { opacity: 0.5; }
    62% { opacity: 0; }
  }
  /* ---- firework burst ---- */
  .burst { transform-origin: center; }
  .burst circle.spark {
    animation: sparkOut 1.4s cubic-bezier(.2,.7,.3,1) infinite;

    transform-origin: center;
  }
  @keyframes sparkOut {
    0% { transform: translate(0,0) scale(1); opacity: 1; }
    75% { opacity: 0.8; }
    100% { transform: translate(var(--dx), var(--dy)) scale(0.2); opacity: 0; }
  }
  .burst-core {
    animation: coreFlash 2.6s ease-in-out infinite;
  }
  @keyframes coreFlash {
    0%, 100% { opacity: 0; transform: scale(0.2); }
    4% { opacity: 1; transform: scale(1); }
    12% { opacity: 0; transform: scale(1.6); }
  }
  /* ---- rising smoke wisps ---- */
  .smoke-wisp {
    animation: rise 6s ease-in infinite;
    transform-origin: bottom center;
  }
  @keyframes rise {
    0% { transform: translateY(0) scale(1); opacity: 0; }
    15% { opacity: 0.5; }
    100% { transform: translateY(-140px) scale(1.6); opacity: 0; }
  }
  /* ---- smoke coalescing into "Sorry" text ---- */
  .sorry-text {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 74px;
    fill: var(--cream);
    text-anchor: middle;
    filter: blur(14px);
    opacity: 0;
    animation: coalesce 7s ease-in-out infinite;
    animation-delay: 0.6s;
  }
  @keyframes coalesce {
    0% { filter: blur(18px); opacity: 0; transform: translateY(10px) scale(0.96); }
    28% { filter: blur(0px); opacity: 1; transform: translateY(0) scale(1); }
    70% { filter: blur(0px); opacity: 1; transform: translateY(0) scale(1); }
    88% { filter: blur(10px); opacity: 0.3; transform: translateY(-6px) scale(1.02); }
    100% { filter: blur(18px); opacity: 0; transform: translateY(10px) scale(0.96); }
  }
  /* ---- heart between ---- */
  .heart-pulse {
    animation: pulse 1.1s ease-in-out infinite, heartFade 7s ease-in-out infinite;
    transform-origin: center;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }
  @keyframes heartFade {
    0%, 100% { opacity: 0; }
    20% { opacity: 1; }
    80% { opacity: 1; }
    95% { opacity: 0; }
  }

  /* ---- cracked heart + sorry inside ---- */
  .heart-sorry {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 28px;
    fill: var(--cream);
    text-anchor: middle;
    dominant-baseline: middle;
    opacity: 0;
    animation: sorryInside 7s ease-in-out infinite;
  }
  @keyframes sorryInside {
    0%, 12% { opacity: 0; transform: scale(.75); }
    22% { opacity: 1; transform: scale(1); }
    75% { opacity: 1; transform: scale(1); }
    90%, 100% { opacity: 0; transform: scale(.85); }
  }
  .heart-crack {
    fill: none;
    stroke: #fff3d6;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
    stroke-dasharray: 120;
    stroke-dashoffset: 120;
    opacity: 0;
    animation: crackOpen 7s ease-in-out infinite;
  }
  @keyframes crackOpen {
    0%, 18% { opacity: 0; stroke-dashoffset: 120; }
    30% { opacity: 1; stroke-dashoffset: 0; }
    70% { opacity: 1; stroke-dashoffset: 0; }
    90%, 100% { opacity: 0; stroke-dashoffset: 120; }
  }
  .heart-glow { animation: heartGlow 7s ease-in-out infinite; }
  @keyframes heartGlow {
    0%, 100% { opacity: .55; }
    25%, 70% { opacity: 1; }
  }
  .caption {
    position: absolute;
    left: 50%;
    bottom: calc(2.2rem + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    max-width: min(85%, 520px);
    text-align: center;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(0.95rem, 3.4vw, 1.15rem);
    color: var(--cream);

    text-shadow: 0 2px 10px rgba(0,0,0,0.6);
    opacity: 0.85;
    z-index: 6;
    pointer-events: none;
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  }
</style>
</head>
<body>
<div id="stage">
  <svg viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
    <defs>
      <radialGradient id="sparkGlow" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#fff3d6"/>
        <stop offset="100%" stop-color="#ffb347" stop-opacity="0"/>
      </radialGradient>
      <linearGradient id="skyNight" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0c0f1e"/>
        <stop offset="100%" stop-color="#1c2340"/>
      </linearGradient>
    </defs>
    <rect width="800" height="500" fill="url(#skyNight)"/>
    <!-- distant skyline silhouette -->
    <g fill="#080a16">
      <rect x="0" y="400" width="120" height="100"/>
      <rect x="130" y="360" width="90" height="140"/>
      <rect x="600" y="380" width="100" height="120"/>
      <rect x="710" y="340" width="90" height="160"/>
    </g>
    <!-- FIREWORK BURST 1 (left) -->
    <g class="burst" transform="translate(180,140)" style="animation-delay:0s;">
      <circle class="burst-core" r="10" fill="url(#sparkGlow)" style="animation-delay:0s;"/>
      <g stroke-linecap="round">
        <circle class="spark" cx="0" cy="0" r="3" fill="#ffb347" style="--dx:60px; --dy:-20px; animation-delay:0s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ff8fa3" style="--dx:-55px; --dy:-30px; animation-delay:0.05s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#fff3d6" style="--dx:40px; --dy:45px; animation-delay:0.1s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ffb347" style="--dx:-45px; --dy:40px; animation-delay:0.02s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ff8fa3" style="--dx:5px; --dy:-60px; animation-delay:0.08s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#fff3d6" style="--dx:-10px; --dy:60px; animation-delay:0.12s;"/>
      </g>
    </g>
    <!-- FIREWORK BURST 2 (right) -->
    <g class="burst" transform="translate(620,110)" style="animation-delay:1.3s;">
      <circle class="burst-core" r="10" fill="url(#sparkGlow)" style="animation-delay:1.3s;"/>
      <g stroke-linecap="round">
        <circle class="spark" cx="0" cy="0" r="3" fill="#ffb347" style="--dx:55px; --dy:-25px; animation-delay:1.3s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ff8fa3" style="--dx:-50px; --dy:-35px; animation-delay:1.35s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#fff3d6" style="--dx:45px; --dy:40px; animation-delay:1.4s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ffb347" style="--dx:-40px; --dy:45px; animation-delay:1.32s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ff8fa3" style="--dx:10px; --dy:-55px; animation-delay:1.38s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#fff3d6" style="--dx:-15px; --dy:55px; animation-delay:1.42s;"/>
      </g>
    </g>
    <!-- FIREWORK BURST 3 (center-top) -->
    <g class="burst" transform="translate(400,90)" style="animation-delay:2.5s;">
      <circle class="burst-core" r="10" fill="url(#sparkGlow)" style="animation-delay:2.5s;"/>
      <g stroke-linecap="round">
        <circle class="spark" cx="0" cy="0" r="3" fill="#ffb347" style="--dx:50px; --dy:-15px; animation-delay:2.5s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ff8fa3" style="--dx:-50px; --dy:-20px; animation-delay:2.55s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#fff3d6" style="--dx:35px; --dy:40px; animation-delay:2.6s;"/>
        <circle class="spark" cx="0" cy="0" r="3" fill="#ffb347" style="--dx:-35px; --dy:40px; animation-delay:2.52s;"/>
      </g>
    </g>
    <!-- rising smoke wisps behind the text -->
    <g opacity="0.55">
      <ellipse class="smoke-wisp" cx="300" cy="340" rx="26" ry="16" fill="#9aa0b8" style="animation-delay:0.2s;"/>

      <ellipse class="smoke-wisp" cx="500" cy="330" rx="30" ry="18" fill="#9aa0b8" style="animation-delay:1.4s;"/>
      <ellipse class="smoke-wisp" cx="400" cy="350" rx="24" ry="14" fill="#9aa0b8" style="animation-delay:2.6s;"/>
      <ellipse class="smoke-wisp" cx="350" cy="335" rx="20" ry="12" fill="#9aa0b8" style="animation-delay:3.4s;"/>
      <ellipse class="smoke-wisp" cx="460" cy="345" rx="22" ry="13" fill="#9aa0b8" style="animation-delay:4.1s;"/>
    </g>
    <!-- cracked heart with "Sorry" inside -->
    <g class="heart-pulse" transform="translate(400,305) scale(1.45)">
      <path class="heart-glow" d="M0,-8 C-12,-28 -40,-20 -40,4 C-40,28 0,52 0,52 C0,52 40,28 40,4 C40,-20 12,-28 0,-8 Z"
            fill="#ff8fa3" stroke="#fff3d6" stroke-width="2" opacity="0.95"/>
      <text class="heart-sorry" x="0" y="10">Sorry</text>
      <path class="heart-crack" d="M0,-18 L-5,-2 L4,10 L-4,20 L3,34 L0,47"/>
      <path class="heart-crack" d="M-5,-2 L-17,7 L-11,15" style="animation-delay:.12s"/>
      <path class="heart-crack" d="M4,10 L16,5 L12,-5" style="animation-delay:.18s"/>
      <path class="heart-crack" d="M-4,20 L-15,25" style="animation-delay:.24s"/>
    </g>
  </svg>
  <div class="flash"></div>
  <div class="caption">Every spark says what words keep missing — I'm sorry.</div>
</div>
</body>
</html>
